version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-store_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - store-net

  inventory-api:
    build:
      context: ./inventory-api
    image: store/inventory-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-store_inventory}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - store-net

  orders-api:
    build:
      context: ./orders-api
    image: store/orders-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-store_inventory}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - store-net

  frontend:
    build:
      context: ./frontend
    image: store/frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      inventory-api:
        condition: service_healthy
      orders-api:
        condition: service_healthy
    networks:
      - store-net

  proxy:
    build:
      context: ./proxy
    image: store/proxy:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      frontend:
        condition: service_started
      inventory-api:
        condition: service_healthy
      orders-api:
        condition: service_healthy
    networks:
      - store-net

volumes:
  pgdata:

networks:
  store-net:
    driver: bridge
